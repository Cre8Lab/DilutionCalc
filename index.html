<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>藥劑兩階段稀釋計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .input-box:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body class="text-slate-800 pb-10">

  <!-- 頂部極簡導覽列 -->
  <header class="bg-slate-900 text-white px-4 py-3.5 sticky top-0 z-20 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <h1 class="text-lg font-bold tracking-wide">藥劑稀釋計算</h1>
      <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
        <button id="unitG" onclick="setUnit('g')" class="px-3 py-1 text-sm font-bold rounded-md bg-blue-600 text-white transition">g</button>
        <button id="unitMl" onclick="setUnit('mL')" class="px-3 py-1 text-sm font-bold rounded-md text-slate-300 transition">mL</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- 卡片一：一次稀釋 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-amber-50 px-3.5 py-3 border-b border-amber-100 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-7 h-7 rounded-full bg-amber-500 text-white text-base font-bold flex items-center justify-center">1</span>
          <h2 class="font-bold text-lg text-slate-900">一次稀釋</h2>
        </div>
        <!-- 雙按鈕分段切換：定量至 / 外添溶劑(水) -->
        <div class="flex bg-amber-200/60 p-1 rounded-lg border border-amber-300/70 shrink-0">
          <button id="m1TotalBtn" onclick="setMode(1, 'total')" class="px-2.5 py-1 text-xs font-bold rounded-md bg-amber-600 text-white shadow-sm transition whitespace-nowrap">定量至</button>
          <button id="m1AddBtn" onclick="setMode(1, 'add')" class="px-2.5 py-1 text-xs font-bold rounded-md text-amber-900 transition whitespace-nowrap">外添溶劑(水)</button>
        </div>
      </div>

      <div class="p-4 space-y-4">
        <!-- 原藥劑濃度 -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-base font-bold text-slate-700">原藥劑濃度</label>
            <button onclick="toggleC0Unit()" id="c0UnitBtn" class="text-sm font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md active:bg-blue-100">
              單位：% (點此切換 ppm)
            </button>
          </div>
          <div class="relative">
            <input type="number" inputmode="decimal" id="c0Input" value="100" oninput="calculate()" class="input-box w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-2xl font-bold text-slate-900 pr-16">
            <span id="c0UnitBadge" class="absolute right-4 top-1/2 -translate-y-1/2 text-lg font-bold text-slate-400">%</span>
          </div>
        </div>

        <!-- 取樣量 與 定量至/外添溶劑量 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1.5">取樣量 (<span class="unit-label">g</span>)</label>
            <input type="number" inputmode="decimal" id="w1Input" value="1" oninput="calculate()" class="input-box w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-2xl font-bold text-slate-900">
          </div>
          <div>
            <label id="v1Label" class="block text-base font-bold text-slate-700 mb-1.5">定量至 (<span class="unit-label">g</span>)</label>
            <input type="number" inputmode="decimal" id="v1Input" value="100" oninput="calculate()" class="input-box w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-2xl font-bold text-slate-900">
          </div>
        </div>

        <!-- 一次稀釋結果 -->
        <div class="bg-amber-50/70 rounded-xl p-3.5 border border-amber-200 flex items-center justify-between">
          <div>
            <div class="text-sm font-bold text-amber-800">一次稀釋液濃度</div>
            <div id="stage1Hint" class="text-xs text-amber-600 mt-0.5">配製總量 100 g</div>
          </div>
          <div class="text-right">
            <span id="c1Result" class="text-3xl font-extrabold text-amber-700 tracking-tight">10,000</span>
            <span class="text-base font-bold text-amber-700 ml-1">ppm</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 卡片二：二次稀釋 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-blue-50 px-3.5 py-3 border-b border-blue-100 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-7 h-7 rounded-full bg-blue-600 text-white text-base font-bold flex items-center justify-center">2</span>
          <h2 class="font-bold text-lg text-slate-900">二次稀釋</h2>
        </div>
        <!-- 雙按鈕分段切換：定量至 / 外添溶劑(水) -->
        <div class="flex bg-blue-200/60 p-1 rounded-lg border border-blue-300/70 shrink-0">
          <button id="m2TotalBtn" onclick="setMode(2, 'total')" class="px-2.5 py-1 text-xs font-bold rounded-md text-blue-900 transition whitespace-nowrap">定量至</button>
          <button id="m2AddBtn" onclick="setMode(2, 'add')" class="px-2.5 py-1 text-xs font-bold rounded-md bg-blue-600 text-white shadow-sm transition whitespace-nowrap">外添溶劑(水)</button>
        </div>
      </div>

      <div class="p-4 space-y-4">
        <!-- 純顯示一次稀釋液濃度（自動連動） -->
        <div class="bg-slate-50 rounded-xl px-3.5 py-2.5 border border-slate-200 flex items-center justify-between">
          <span class="text-sm font-bold text-slate-600">使用一次稀釋液：</span>
          <span class="text-base font-extrabold text-slate-900"><span id="c1DisplayMini">10,000</span> <span class="text-xs font-bold text-slate-500">ppm</span></span>
        </div>

        <!-- 目標濃度 與 稀釋量 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-base font-bold text-slate-700 mb-1.5">目標濃度 (ppm)</label>
            <input type="number" inputmode="decimal" id="c2Input" value="100" oninput="calculate()" class="input-box w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-2xl font-bold text-slate-900">
          </div>
          <div>
            <label id="v2Label" class="block text-base font-bold text-slate-700 mb-1.5">外添溶劑量 (<span class="unit-label">g</span>)</label>
            <input type="number" inputmode="decimal" id="v2Input" value="100" oninput="calculate()" class="input-box w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-2xl font-bold text-slate-900">
          </div>
        </div>

        <!-- 錯誤警告 -->
        <div id="errorAlert" class="hidden bg-red-50 border border-red-200 text-red-700 px-3.5 py-3 rounded-xl text-base font-bold">
          目標濃度必須小於一次稀釋液濃度！
        </div>

        <!-- 最終取樣量結果框 (高對比大字體) -->
        <div id="resultCard" class="bg-blue-600 rounded-2xl p-4 text-white shadow-md">
          <div class="flex items-center justify-between mb-1">
            <span class="text-base font-bold text-blue-100">需加入一次稀釋液</span>
            <button onclick="copyResult()" id="copyBtn" class="bg-blue-500 hover:bg-blue-400 active:bg-blue-700 text-white text-sm font-bold px-3 py-1 rounded-lg transition">
              複製數值
            </button>
          </div>
          <div class="flex items-baseline gap-2 my-1">
            <span id="w2Result" class="text-4xl font-extrabold tracking-tight">1.0101</span>
            <span class="text-xl font-bold text-blue-200 unit-label">g</span>
          </div>
          <div id="stage2Hint" class="text-sm text-blue-100 mt-1 border-t border-blue-500/60 pt-2">
            配製後總量：101.0101 g
          </div>
        </div>
      </div>
    </section>

    <!-- 一鍵清空重算按鈕 -->
    <button onclick="clearValues()" class="w-full py-3.5 rounded-xl bg-white border border-slate-300 text-slate-600 font-bold text-base active:bg-slate-100 transition">
      清空數值
    </button>

  </main>

  <script>
    let currentUnit = 'g';
    let c0IsPercent = true;
    let mode1 = 'total';   // 'total' = 定量至, 'add' = 外添溶劑(水)
    let mode2 = 'add';     // 'add' = 外添溶劑(水), 'total' = 定量至
    let lastW2Value = '1.0101';

    function setUnit(unit) {
      currentUnit = unit;
      document.getElementById('unitG').className = unit === 'g'
        ? 'px-3 py-1 text-sm font-bold rounded-md bg-blue-600 text-white transition'
        : 'px-3 py-1 text-sm font-bold rounded-md text-slate-300 transition';
      document.getElementById('unitMl').className = unit === 'mL'
        ? 'px-3 py-1 text-sm font-bold rounded-md bg-blue-600 text-white transition'
        : 'px-3 py-1 text-sm font-bold rounded-md text-slate-300 transition';

      document.querySelectorAll('.unit-label').forEach(el => el.textContent = unit);
      calculate();
    }

    function toggleC0Unit() {
      const input = document.getElementById('c0Input');
      const val = parseFloat(input.value) || 0;
      c0IsPercent = !c0IsPercent;

      if (c0IsPercent) {
        input.value = val ? +(val / 10000).toFixed(4) : '';
        document.getElementById('c0UnitBtn').textContent = '單位：% (點此切換 ppm)';
        document.getElementById('c0UnitBadge').textContent = '%';
      } else {
        input.value = val ? Math.round(val * 10000) : '';
        document.getElementById('c0UnitBtn').textContent = '單位：ppm (點此切換 %)';
        document.getElementById('c0UnitBadge').textContent = 'ppm';
      }
      calculate();
    }

    function setMode(stage, newMode) {
      if (stage === 1) {
        mode1 = newMode;
      } else {
        mode2 = newMode;
      }
      updateModeUI();
      calculate();
    }

    function updateModeUI() {
      // 一次稀釋雙按鈕樣式與下方欄位標題
      const m1Total = document.getElementById('m1TotalBtn');
      const m1Add = document.getElementById('m1AddBtn');
      const v1Label = document.getElementById('v1Label');

      if (mode1 === 'total') {
        m1Total.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-amber-600 text-white shadow-sm transition whitespace-nowrap';
        m1Add.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-amber-900 transition whitespace-nowrap';
        v1Label.innerHTML = `定量至 (<span class="unit-label">${currentUnit}</span>)`;
      } else {
        m1Total.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-amber-900 transition whitespace-nowrap';
        m1Add.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-amber-600 text-white shadow-sm transition whitespace-nowrap';
        v1Label.innerHTML = `外添溶劑量 (<span class="unit-label">${currentUnit}</span>)`;
      }

      // 二次稀釋雙按鈕樣式與下方欄位標題
      const m2Total = document.getElementById('m2TotalBtn');
      const m2Add = document.getElementById('m2AddBtn');
      const v2Label = document.getElementById('v2Label');

      if (mode2 === 'total') {
        m2Total.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-blue-600 text-white shadow-sm transition whitespace-nowrap';
        m2Add.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-blue-900 transition whitespace-nowrap';
        v2Label.innerHTML = `定量至 (<span class="unit-label">${currentUnit}</span>)`;
      } else {
        m2Total.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-blue-900 transition whitespace-nowrap';
        m2Add.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-blue-600 text-white shadow-sm transition whitespace-nowrap';
        v2Label.innerHTML = `外添溶劑量 (<span class="unit-label">${currentUnit}</span>)`;
      }
    }

    function clearValues() {
      document.getElementById('c0Input').value = '';
      document.getElementById('w1Input').value = '';
      document.getElementById('v1Input').value = '';
      document.getElementById('c2Input').value = '';
      document.getElementById('v2Input').value = '';
      calculate();
    }

    function formatNum(num, decimals = 2) {
      if (!isFinite(num) || isNaN(num)) return '-';
      return Number(num.toFixed(decimals)).toLocaleString('en-US', { maximumFractionDigits: decimals });
    }

    function calculate() {
      const c0Raw = parseFloat(document.getElementById('c0Input').value) || 0;
      const c0Ppm = c0IsPercent ? c0Raw * 10000 : c0Raw;
      const w1 = parseFloat(document.getElementById('w1Input').value) || 0;
      const v1 = parseFloat(document.getElementById('v1Input').value) || 0;

      // 一次稀釋計算
      let c1Ppm = 0;
      let total1 = 0;
      if (w1 > 0 && v1 > 0) {
        if (mode1 === 'total') {
          total1 = v1;
          c1Ppm = c0Ppm * (w1 / v1);
        } else {
          total1 = w1 + v1;
          c1Ppm = c0Ppm * (w1 / total1);
        }
      }

      document.getElementById('c1Result').textContent = c1Ppm > 0 ? formatNum(c1Ppm, 2) : '-';
      document.getElementById('stage1Hint').textContent = total1 > 0 ? `配製總量 ${formatNum(total1, 2)} ${currentUnit}` : '請輸入數值';
      document.getElementById('c1DisplayMini').textContent = c1Ppm > 0 ? formatNum(c1Ppm, 2) : '0';

      // 二次稀釋計算（直接連動一次稀釋濃度 c1Ppm）
      const c2Ppm = parseFloat(document.getElementById('c2Input').value) || 0;
      const v2 = parseFloat(document.getElementById('v2Input').value) || 0;

      const errorAlert = document.getElementById('errorAlert');
      const resultCard = document.getElementById('resultCard');

      if (c1Ppm > 0 && c2Ppm >= c1Ppm) {
        errorAlert.classList.remove('hidden');
        resultCard.classList.add('opacity-40');
        document.getElementById('w2Result').textContent = '-';
        document.getElementById('stage2Hint').textContent = '無法計算';
        lastW2Value = '';
        return;
      } else {
        errorAlert.classList.add('hidden');
        resultCard.classList.remove('opacity-40');
      }

      let w2 = 0;
      let total2 = 0;
      if (c1Ppm > 0 && c2Ppm > 0 && v2 > 0) {
        if (mode2 === 'add') {
          w2 = (c2Ppm * v2) / (c1Ppm - c2Ppm);
          total2 = w2 + v2;
        } else {
          w2 = (c2Ppm * v2) / c1Ppm;
          total2 = v2;
        }
      }

      if (w2 > 0) {
        const w2Formatted = w2.toFixed(4);
        lastW2Value = w2Formatted;
        document.getElementById('w2Result').textContent = w2Formatted;
        document.getElementById('stage2Hint').textContent = `配製後總量：${total2.toFixed(4)} ${currentUnit}`;
      } else {
        lastW2Value = '';
        document.getElementById('w2Result').textContent = '-';
        document.getElementById('stage2Hint').textContent = '請輸入目標濃度與稀釋量';
      }
    }

    function copyResult() {
      if (!lastW2Value) return;
      const tempInput = document.createElement('input');
      tempInput.value = lastW2Value;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      const btn = document.getElementById('copyBtn');
      btn.textContent = '已複製！';
      btn.classList.replace('bg-blue-500', 'bg-emerald-500');
      setTimeout(() => {
        btn.textContent = '複製數值';
        btn.classList.replace('bg-emerald-500', 'bg-blue-500');
      }, 1500);
    }

    // 初始化
    updateModeUI();
    calculate();
  </script>
</body>
</html>
